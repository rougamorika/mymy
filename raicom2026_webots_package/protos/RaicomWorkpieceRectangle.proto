#VRML_SIM R2023b utf8

PROTO RaicomWorkpieceRectangle [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 0
  field SFString name "raicom_rectangle_piece"
  field SFColor color 0.82 0.04 0.02
  field SFBool locked FALSE
  field SFFloat mass 0.03
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "RAICOM2026 Rectangle Workpiece"
    locked IS locked
    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          metalness 0
          roughness 1
        }
        geometry DEF WORKPIECE_PRISM IndexedFaceSet {
          coord Coordinate {
            point [
              -0.025000 -0.020000 0,
              0.025000 -0.020000 0,
              0.025000 0.020000 0,
              -0.025000 0.020000 0,
              -0.025000 -0.020000 0.015000,
              0.025000 -0.020000 0.015000,
              0.025000 0.020000 0.015000,
              -0.025000 0.020000 0.015000
            ]
          }
          coordIndex [
            3 2 1 0 -1
            4 5 6 7 -1
            0 1 5 4 -1
            1 2 6 5 -1
            2 3 7 6 -1
            3 0 4 7 -1
          ]
        }
      }
    ]
    boundingObject Shape {
      geometry USE WORKPIECE_PRISM
    }
    physics Physics {
      density -1
      mass IS mass
      damping Damping {
        linear 0.6
        angular 0.6
      }
    }
  }
}
