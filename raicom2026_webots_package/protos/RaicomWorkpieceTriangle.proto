#VRML_SIM R2023b utf8

PROTO RaicomWorkpieceTriangle [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 0
  field SFString name "raicom_triangle_piece"
  field SFColor color 0.95 0.34 0.55
  field SFBool locked FALSE
  field SFFloat mass 0.03
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "RAICOM2026 Triangle Workpiece"
    locked IS locked
    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          metalness 0
          roughness 1
        }
        geometry DEF WORKPIECE_PRISM IndexedFaceSet {
          coord Coordinate {
            point [
              1.27363e-18 0.0208 0,
              -0.0180133 -0.0104 0,
              0.0180133 -0.0104 0,
              1.27363e-18 0.0208 0.015,
              -0.0180133 -0.0104 0.015,
              0.0180133 -0.0104 0.015
            ]
          }
          coordIndex [
            2 1 0 -1
            3 4 5 -1
            0 1 4 3 -1
            1 2 5 4 -1
            2 0 3 5 -1
          ]
        }
      }
    ]
    boundingObject Shape {
      geometry USE WORKPIECE_PRISM
    }
    physics Physics {
      density -1
      mass IS mass
      damping Damping {
        linear 0.6
        angular 0.6
      }
    }
  }
}
